<!doctype html>

<title>中秋烤肉 250 項勾選清單｜嫦娥月兔版</title>
<style>
:root{
  --ink:#3d3153; --muted:#786b8c; --paper:#fffaf1; --card:#fffdf8;
  --plum:#6f4aa8; --plum2:#9c72cf; --peach:#ff8f8f; --gold:#f6bd58;
  --mint:#7fc8a9; --line:rgba(86,61,115,.14); --shadow:0 15px 40px rgba(72,46,92,.14);
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:
  radial-gradient(circle at 10% 8%, rgba(255,216,151,.35) 0 100px, transparent 101px),
  radial-gradient(circle at 88% 3%, rgba(199,172,236,.35) 0 130px, transparent 131px),
  linear-gradient(180deg,#fff9ed 0,#fbf4ff 55%,#fff8ef 100%);min-height:100vh}
body:before{content:"✦  ·  ✧   ·  ✦  ·  ✧";position:fixed;top:12px;left:2%;right:2%;text-align:center;color:rgba(111,74,168,.18);font-size:22px;letter-spacing:22px;pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{width:min(1280px,calc(100% - 24px));margin:auto;position:relative;z-index:1}
.hero{padding:26px 0 16px}
.hero-card{position:relative;overflow:hidden;border:1px solid rgba(111,74,168,.12);border-radius:30px;background:linear-gradient(135deg,rgba(255,252,241,.96),rgba(246,237,255,.95));box-shadow:var(--shadow);padding:26px 28px;display:grid;grid-template-columns:1fr 230px;gap:20px;align-items:center}
.hero-card:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-78px;bottom:-90px;background:rgba(255,193,106,.15)}
.kicker{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(111,74,168,.18);background:#fff9ff;padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px;color:var(--plum)}
h1{margin:11px 0 6px;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-.03em}
.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.7}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.badge{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:750}
.moon-scene{height:180px;position:relative;display:grid;place-items:center}.moon{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fffbe1 0 24%,#ffe7a5 55%,#ffd276 100%);box-shadow:0 0 0 10px rgba(255,216,125,.12),0 0 44px rgba(255,198,83,.3);position:relative}
.rabbit{position:absolute;width:72px;height:60px;right:26px;bottom:9px;background:#fff;border-radius:45% 48% 42% 45%;box-shadow:0 8px 18px rgba(82,61,102,.14)}
.rabbit:before,.rabbit:after{content:"";position:absolute;width:20px;height:52px;background:#fff;border-radius:99px;top:-38px}.rabbit:before{left:10px;transform:rotate(-12deg)}.rabbit:after{left:35px;transform:rotate(8deg)}
.rabbit .eye{position:absolute;width:5px;height:5px;border-radius:50%;background:#6f4aa8;right:15px;top:20px}.rabbit .tail{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;left:-10px;bottom:7px}
.chang-e{position:absolute;left:2px;bottom:2px;background:rgba(111,74,168,.92);color:white;padding:8px 11px;border-radius:14px 14px 14px 4px;font-size:12px;font-weight:800;box-shadow:0 8px 20px rgba(111,74,168,.22)}
.toolbar{position:sticky;top:0;z-index:20;padding:8px 0 10px;background:linear-gradient(180deg,rgba(255,249,237,.97),rgba(255,249,237,.88),transparent);backdrop-filter:blur(8px)}
.toolbar-card{background:rgba(255,255,255,.88);border:1px solid var(--line);box-shadow:0 8px 28px rgba(75,52,94,.09);border-radius:22px;padding:12px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:#fffafc;border:1px solid rgba(111,74,168,.16);border-radius:14px;padding:0 12px}.search input{width:100%;border:0;outline:0;background:transparent;padding:11px 0;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:800;color:var(--ink);background:#f7f1fb}.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--plum),var(--plum2));color:#fff;box-shadow:0 8px 18px rgba(111,74,168,.24)}.btn.danger{background:#fff0f0;color:#a74b4b}.btn.gold{background:#fff1c9;color:#785514}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 11px;font-size:13px}.stat strong{font-size:16px;color:var(--plum)}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;color:var(--muted)}.tab.active{color:#fff;background:var(--plum);border-color:var(--plum)}
.category{margin:13px 0 22px}.cat-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}.cat-title{display:flex;align-items:center;gap:10px}.cat-title .emoji{font-size:28px}.cat-title h2{font-size:21px;margin:0}.cat-title p{margin:2px 0 0;color:var(--muted);font-size:12px}.cat-tools{display:flex;gap:6px}.mini{border:1px solid var(--line);background:#fff;padding:7px 9px;border-radius:10px;font-weight:800;font-size:12px;color:var(--plum)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(110px,150px);gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 11px;transition:.16s ease;box-shadow:0 2px 8px rgba(84,62,100,.035)}.item:hover{border-color:rgba(111,74,168,.30);box-shadow:0 6px 16px rgba(84,62,100,.08)}.item.selected{background:linear-gradient(135deg,#fffef8,#faf2ff);border-color:rgba(111,74,168,.38);box-shadow:0 7px 18px rgba(111,74,168,.11)}
.check{width:24px;height:24px;accent-color:var(--plum)}.item-name{font-weight:850;font-size:15px}.item-id{font-size:10px;color:#aa9bb5;margin-right:5px}.qty-label{font-size:10px;color:var(--muted);margin-bottom:3px}.qty{width:100%;border:1px solid rgba(111,74,168,.16);background:#fff;border-radius:9px;padding:7px 8px;color:var(--ink);outline:none}.qty:focus{border-color:var(--plum)}
.empty{padding:34px;border:1px dashed rgba(111,74,168,.25);border-radius:18px;text-align:center;color:var(--muted);background:rgba(255,255,255,.55)}
.output{margin:30px 0 70px;background:linear-gradient(135deg,#4d336e,#7551a7);color:#fff;border-radius:28px;padding:22px;box-shadow:0 20px 45px rgba(78,51,111,.22);position:relative;overflow:hidden}.output:after{content:"🌕";position:absolute;right:-20px;top:-20px;font-size:118px;opacity:.09}.output-head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}.output h2{margin:0;font-size:24px}.output small{color:#e6daf5}.out-actions{display:flex;gap:8px;flex-wrap:wrap}.outbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;padding:9px 12px;border-radius:12px;font-weight:800}.outbtn.light{background:#fff;color:#5b3d81}.format{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 10px;position:relative;z-index:1}.format label{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 10px;font-size:12px}.format input{accent-color:#ffd777}
textarea{position:relative;z-index:1;width:100%;min-height:280px;resize:vertical;border:1px solid rgba(255,255,255,.22);border-radius:16px;background:rgba(28,17,41,.28);color:#fff;padding:15px;outline:none;line-height:1.7;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#2f243e;color:#fff;padding:10px 14px;border-radius:999px;font-weight:800;z-index:99;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:0 0 35px}.lanterns{letter-spacing:8px;font-size:20px;margin-bottom:6px}
@media(max-width:860px){.hero-card{grid-template-columns:1fr 155px}.moon{width:125px;height:125px}.moon-scene{height:145px}.rabbit{right:10px}.toolbar-card{grid-template-columns:1fr}.actions{justify-content:flex-start}.grid{grid-template-columns:1fr}.item{grid-template-columns:32px 1fr minmax(105px,135px)}}
@media(max-width:560px){.wrap{width:min(100% - 16px,1280px)}.hero{padding-top:12px}.hero-card{padding:20px 18px;grid-template-columns:1fr}.moon-scene{display:none}.kicker{font-size:12px}h1{font-size:31px}.toolbar{top:0}.toolbar-card{border-radius:17px;padding:8px}.actions .btn{padding:9px 10px;font-size:12px}.cat-head{align-items:flex-start;flex-direction:column}.item{grid-template-columns:30px minmax(0,1fr);gap:7px}.item .qty-wrap{grid-column:2}.output{border-radius:20px;padding:16px}.output-head{align-items:flex-start;flex-direction:column}.out-actions{width:100%}.outbtn{flex:1}.stats{margin-top:8px}}
@media print{.hero,.toolbar,.tabs,.cat-tools,.stats,.footer{display:none!important}.wrap{width:100%}.grid{grid-template-columns:repeat(2,1fr)}.item:not(.selected){display:none}.output{color:#000;background:#fff;box-shadow:none;border:1px solid #ddd}.output textarea{color:#000;background:#fff;border:1px solid #ddd}.out-actions,.format{display:none}}
</style>
</head>

const STORE_KEY='midautumn-bbq-250-v1';
let state={selected:{},qty:{},filter:'ALL',search:''};
try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(saved) state={...state,...saved};}catch(e){}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const catalog=$('#catalog'), tabs=$('#tabs'), search=$('#search'), out=$('#outputText');

function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
function allItems(){return DATA.flatMap(c=>c.items.map(i=>({...i,catId:c.id,catName:c.name,icon:c.icon})));}
function visibleItems(){const q=state.search.trim().toLowerCase();return allItems().filter(i=>(state.filter==='ALL'||i.catId===state.filter)&&(!q||(`${i.name} ${i.qty} ${i.catName}`).toLowerCase().includes(q)));}

function buildTabs(){DATA.forEach(c=>{const b=document.createElement('button');b.className='tab';b.dataset.filter=c.id;b.textContent=`${c.icon} ${c.id} ${c.name} 50`;tabs.appendChild(b)});}
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function render(){
  $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.filter));
  const q=state.search.trim().toLowerCase(); let html='';
  DATA.forEach(c=>{
    if(state.filter!=='ALL'&&state.filter!==c.id)return;
    const items=c.items.filter(i=>!q||(`${i.name} ${i.qty} ${c.name}`).toLowerCase().includes(q));
    if(!items.length)return;
    const selectedInCat=c.items.filter(i=>state.selected[i.id]).length;
    html+=`<section class="category" id="cat-${c.id}"><div class="cat-head"><div class="cat-title"><span class="emoji">${c.icon}</span><div><h2>${c.id}｜${c.name}</h2><p>50 項選擇 · 建議分類預算 NT$${c.budget.toLocaleString()} · 已選 ${selectedInCat}</p></div></div><div class="cat-tools"><button class="mini" data-cat-select="${c.id}">全選此類</button><button class="mini" data-cat-clear="${c.id}">清除此類</button></div></div><div class="grid">`;
    items.forEach(i=>{
      const checked=!!state.selected[i.id], qty=state.qty[i.id]??i.qty;
      html+=`<label class="item ${checked?'selected':''}" data-id="${i.id}"><input class="check" type="checkbox" data-check="${i.id}" ${checked?'checked':''}><div><div class="item-name"><span class="item-id">${i.id}</span>${esc(i.name)}</div></div><div class="qty-wrap"><div class="qty-label">建議／自訂份量</div><input class="qty" data-qty="${i.id}" value="${esc(qty)}" aria-label="${esc(i.name)}份量"></div></label>`;
    });
    html+='</div></section>';
  });
  catalog.innerHTML=html||'<div class="empty">🌙 找不到符合條件的品項，換個關鍵字試試。</div>';
  bindCatalog(); updateStats(); generateText();
}
function bindCatalog(){
  $$('[data-check]').forEach(el=>el.addEventListener('change',e=>{const id=e.target.dataset.check;state.selected[id]=e.target.checked;if(!e.target.checked)delete state.selected[id];save();render();}));
  $$('[data-qty]').forEach(el=>{el.addEventListener('click',e=>e.stopPropagation());el.addEventListener('input',e=>{state.qty[e.target.dataset.qty]=e.target.value;save();generateText();});});
  $$('[data-cat-select]').forEach(b=>b.addEventListener('click',()=>{const c=DATA.find(x=>x.id===b.dataset.catSelect);c.items.forEach(i=>state.selected[i.id]=true);save();render();}));
  $$('[data-cat-clear]').forEach(b=>b.addEventListener('click',()=>{const c=DATA.find(x=>x.id===b.dataset.catClear);c.items.forEach(i=>delete state.selected[i.id]);save();render();}));
}
function updateStats(){const ids=Object.keys(state.selected).filter(k=>state.selected[k]);$('#selectedCount').textContent=ids.length;const cats=DATA.filter(c=>c.items.some(i=>state.selected[i.id])).length;$('#categoryCount').textContent=cats;}
function formatText(){
  const fmt=document.querySelector('input[name="fmt"]:checked').value;
  const chosen=DATA.map(c=>({...c,items:c.items.filter(i=>state.selected[i.id])})).filter(c=>c.items.length);
  if(!chosen.length)return '';
  if(fmt==='names') return chosen.flatMap(c=>c.items.map(i=>i.name)).join('、');
  let lines=['🌕 11 人中秋烤肉｜最終採購清單','預算基準：NT$800／人｜總預算 NT$8,800',''];
  chosen.forEach(c=>{lines.push(`${c.icon} ${c.id}｜${c.name}（${c.items.length}項）`);c.items.forEach(i=>{const qty=(state.qty[i.id]??i.qty).trim();lines.push(fmt==='compact'?`・${i.name}`:`・${i.name}${qty?`｜${qty}`:''}`)});lines.push('');});
  lines.push(`✅ 共 ${chosen.reduce((n,c)=>n+c.items.length,0)} 項`);return lines.join('\n');
}
function generateText(){out.value=formatText();}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}

buildTabs(); search.value=state.search; render();
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;state.filter=b.dataset.filter;save();render();window.scrollTo({top:$('.stats').offsetTop-75,behavior:'smooth'});});
search.addEventListener('input',e=>{state.search=e.target.value;save();render();});
$('#selectVisible').addEventListener('click',()=>{visibleItems().forEach(i=>state.selected[i.id]=true);save();render();toast('已勾選目前顯示的品項');});
$('#clearAll').addEventListener('click',()=>{if(confirm('確定要清空全部勾選嗎？')){state.selected={};save();render();toast('已清空')}});
$('#generate').addEventListener('click',()=>{generateText();$('#outputSection').scrollIntoView({behavior:'smooth',block:'start'});});
$$('input[name="fmt"]').forEach(r=>r.addEventListener('change',generateText));
$('#copyBtn').addEventListener('click',async()=>{generateText();if(!out.value){toast('請先勾選品項');return;}try{await navigator.clipboard.writeText(out.value);toast('已複製，可以直接貼到訊息');}catch(e){out.select();document.execCommand('copy');toast('已複製，可以直接貼到訊息');}});
$('#downloadBtn').addEventListener('click',()=>{generateText();if(!out.value){toast('請先勾選品項');return;}const blob=new Blob([out.value],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='中秋烤肉最終採購清單.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);});
</script>
